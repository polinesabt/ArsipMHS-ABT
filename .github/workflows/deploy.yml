name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install frontend dependencies
      - name: Install NPM Dependencies
        run: npm install

      # Build Vite project
      - name: Build Frontend
        run: npm run build

      - name: Assemble safe backend upload
        run: |
          mkdir -p deploy-backend/vendor deploy-backend/storage
          cp -R backend/api backend/config deploy-backend/
          cp backend/.htaccess deploy-backend/.htaccess
          cp backend/vendor/.htaccess deploy-backend/vendor/.htaccess
          cp backend/storage/.htaccess deploy-backend/storage/.htaccess
          if find deploy-backend -type f \( -name '*.sql' -o -name '*.phar' -o -name '.env' -o -name '*.log' \) | grep -q .; then
            echo 'Unsafe backend artifact in deployment package' >&2
            exit 1
          fi

      # Upload frontend (dist)
      - name: Deploy Frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # Upload backend
      - name: Deploy Backend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy-backend/
          server-dir: public_html/backend/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/node_modules/**
